<mat-card id="matcard">
  <mat-card-content>
    <table mat-table [dataSource]="tableDataSource" class="mat-elevation-z8">
      <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
        <th mat-header-cell *matHeaderCellDef> {{ column | titlecase }} </th>
        <td mat-cell *matCellDef="let element">
          <ng-container [ngSwitch]="column">
            <span *ngSwitchCase="'status'">
              <mat-icon [ngClass]="getStatusClass(element.status)">
                {{ getStatusIcon(element.status) }}
              </mat-icon>
            </span>
            <span *ngSwitchCase="'action'" style="cursor: pointer;">
              <span (click)="editBooking(element)">
                <mat-icon>keyboard_arrow_right</mat-icon>
              </span>
            </span>
            <span *ngSwitchDefault>
              {{ element[column] }}
            </span>
          </ng-container>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
<mat-paginator #paginator [pageSizeOptions]="pageSizes" showFirstLastButtons></mat-paginator>
